name: Release

# Builds the standalone TelegramTOI desktop app for Windows and Linux and
# attaches the archives to a GitHub Release. Triggered by pushing a v* tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TelegramTOI-windows-x64.zip
          - os: ubuntu-latest
            artifact: TelegramTOI-linux-x64.tar.gz
          - os: macos-latest
            artifact: TelegramTOI-macos-arm64.zip
          # Intel macOS: GitHub-hosted `macos-13` runners are being retired and
          # frequently sit un-dispatched. Re-enable when runners are available.
          # - os: macos-13
          #   artifact: TelegramTOI-macos-x64.zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --clean TelegramTOI.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TelegramTOI/* -DestinationPath ${{ matrix.artifact }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }} -C dist/TelegramTOI .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/TelegramTOI.app" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TelegramTOI ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Install

            | Platform | Download | Run |
            |----------|----------|-----|
            | Windows | `TelegramTOI-windows-x64.zip` | Unzip, run `TelegramTOI.exe` |
            | Linux | `TelegramTOI-linux-x64.tar.gz` | `tar -xzf`, run `./TelegramTOI` |
            | macOS (Apple Silicon) | `TelegramTOI-macos-arm64.zip` | Unzip, right-click `TelegramTOI.app` → Open |

            The apps are **unsigned**. macOS Gatekeeper needs right-click → Open (or
            `xattr -dr com.apple.quarantine TelegramTOI.app`); Windows SmartScreen
            needs "More info" → "Run anyway".

            On first launch you sign in to Telegram (phone → code → 2FA if set); the
            session is stored per-user and reused afterwards.

            ---

